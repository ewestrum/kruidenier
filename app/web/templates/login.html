{% extends "base.html" %}
{% block title %}Inloggen - Kruidenier{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<span class="wordmark">Kruidenier<span class="sprig">.</span></span>
<h1>Inloggen</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="panel" style="margin-top:16px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field">
    <label for="email">E-mailadres</label>
    <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}" autofocus>
  </div>
  <div class="field">
    <label for="password">Wachtwoord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="btn" type="submit">Inloggen</button>
</form>
{% endblock %}
